services:
  mysql:
    image: mysql:8.0
    container_name: observacidade-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: observa_cidade
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: observacidade-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/observa_cidade?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8"
      DB_USER: root
      DB_PASSWORD: root
      DB_DDL_AUTO: update
      JWT_SECRET: "troque-esta-chave-jwt-em-producao-com-32-caracteres"
      APP_ADMIN_EMAIL: admin@observacidade.com
      APP_ADMIN_SENHA: admin123
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"

volumes:
  mysql_data:
