# Perfil de desenvolvimento sem MySQL.
# Rode com: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Os dados ficam salvos em ./data/observacidade.mv.db
spring.datasource.url=jdbc:h2:file:./data/observacidade;MODE=MySQL;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Console web do H2 (apenas em desenvolvimento): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.admin.email=${APP_ADMIN_EMAIL:admin@observacidade.com}
app.admin.senha=${APP_ADMIN_SENHA:admin123}
