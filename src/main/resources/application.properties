spring.application.name=observacidade

# ===============================
# Servidor
# ===============================
server.port=${PORT:8080}

# ===============================
# Banco de dados (MySQL)
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/observa_cidade?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:!Dyon785277}

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Upload de imagens (multipart)
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.max-bytes=${UPLOAD_MAX_BYTES:5242880}

# ===============================
# JWT
# ===============================
# Em produção SEMPRE defina JWT_SECRET com um valor próprio (mínimo 32 caracteres).
app.jwt.secret=${JWT_SECRET:observacidade-chave-secreta-jwt-minimo-32-caracteres}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# CORS (separe múltiplas origens por vírgula)
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ===============================
# Usuário administrador inicial
# Criado apenas se ainda não existir. Deixe a senha vazia para desativar.
# Troque a senha após o primeiro acesso!
# ===============================
app.admin.email=${APP_ADMIN_EMAIL:admin@observacidade.com}
app.admin.senha=${APP_ADMIN_SENHA:admin123}

# ===============================
# Assistente virtual (FAQ + IA)
# ===============================
# A base de FAQ funciona sozinha. Para as respostas serem redigidas por um
# modelo, defina a chave (a variável de ambiente tem prioridade):
#   GEMINI_API_KEY=...   -> provider gemini (padrão)
#   OPENAI_API_KEY=...   -> provider openai
# Sem chave, o assistente responde direto com a base de conhecimento.
assistente.llm.habilitado=${ASSISTENTE_LLM_HABILITADO:true}
assistente.llm.provider=${ASSISTENTE_LLM_PROVIDER:gemini}
assistente.llm.chave=${GEMINI_API_KEY:${OPENAI_API_KEY:}}
assistente.llm.modelo=${ASSISTENTE_LLM_MODELO:}
assistente.llm.url=${ASSISTENTE_LLM_URL:}
assistente.llm.timeout-segundos=${ASSISTENTE_LLM_TIMEOUT:20}
assistente.faq.pontuacao-minima=${ASSISTENTE_FAQ_PONTUACAO_MINIMA:0.18}
assistente.faq.limite-sugestoes=${ASSISTENTE_FAQ_LIMITE_SUGESTOES:4}

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===============================
# Jackson
# ===============================
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null
